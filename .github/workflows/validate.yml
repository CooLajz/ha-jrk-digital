name: Kontrola integrace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  marketplace:
    name: HACS (integrace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    name: Testy integrace a karty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.11.0 SQLAlchemy==2.0.54 fnv-hash-fast==2.0.3
      - run: python -m unittest discover -s tests -v
      - run: node --check custom_components/jrk_digital/www/jrk-waste-card.js
